# Gitleaks configuration — extend the default rules for CI and local scans.

[extend]
useDefault = true

# Allowlist the detect-secrets baseline file (contains high-entropy hashes
# by design) and any test fixtures staged with fake secrets.
[allowlist]
description = "False-positive file paths (detect-secrets baseline, test fixtures)"
paths = [
  '(^|.*/)\.secrets\.baseline(\.new)?$',
  '^tests/fixtures/.*',
]
