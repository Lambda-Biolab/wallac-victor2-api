name: pre-commit autoupdate

"on":
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  autoupdate:
    name: Bump pre-commit revisions
    runs-on: ubuntu-latest
    if: hashFiles('.pre-commit-config.yaml') != ''
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.1
      - uses: actions/setup-python@83679a423a8f7177e4b3a13bff910de9898b9afa # v6.2.0
        with:
          python-version: "3.12"
      - name: Install pre-commit
        run: python -m pip install --upgrade pip pre-commit
      - name: Run pre-commit autoupdate
        run: pre-commit autoupdate
      - name: Open PR with updates
        uses: peter-evans/create-pull-request@5f8c9349dc9f1a0d1f9c4dd2adaa6e70fd7d8c1 # v7.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(pre-commit): autoupdate hooks"
          title: "chore(pre-commit): autoupdate hooks"
          body: "Weekly automated update of .pre-commit-config.yaml revisions."
          branch: chore/pre-commit-autoupdate
          delete-branch: true
