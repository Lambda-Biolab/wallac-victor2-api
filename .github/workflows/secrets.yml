name: secrets

"on":
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (history + working tree)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_VERSION: "8.30.1"  # Pin gitleaks binary. Single source of truth across CI + local install_tools Makefile target. 8.30.1 is the latest stable; matches install_tools in Makefile.
          # gitleaks-action v3.0.0 does not pass a `--config` flag to
          # gitleaks, so the action's `with: config-path` input is
          # silently ignored. Set GITLEAKS_CONFIG to the same TOML the
          # `make secrets` local target uses so CI and local scans
          # share the allowlist.
          GITLEAKS_CONFIG: .github/gitleaks.toml
