# Quality gates for the maintained agent stack (docs/102). Install with:
#   make setup_dev
# Run on demand:  make validate
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.15
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: complexipy
        name: complexipy (cognitive <=15, agent stack)
        entry: uv run --locked complexipy -mx 15
        language: system
        files: ^(vm-agent/(agent|lid_watcher|launch_as_user)\.py|bridge/(elabftw|signature|intake|models|errors|lifecycle|abort|writeback|dashboard|config|secrets_check)\.py)$
        pass_filenames: true

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
