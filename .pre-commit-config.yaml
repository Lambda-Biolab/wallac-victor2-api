# Quality gates for the maintained bridge and agent stacks.
# Install with: make setup_dev
# Run manually: uv run --locked pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: mixed-line-ending
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.15
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pyright
        name: pyright (bridge + tests)
        entry: uv run --locked pyright bridge/ tests/
        language: system
        pass_filenames: false
        types: [python]
      - id: complexipy
        name: complexipy (bridge cognitive complexity <=15)
        entry: uv run --locked complexipy bridge/ -mx 15
        language: system
        files: ^bridge/.*\.py$
        pass_filenames: false

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
