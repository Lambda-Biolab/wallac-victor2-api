# Quality gates for the maintained agent stack (docs/102). Install with:
#   make setup_dev
# Run on demand:  make validate
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.15
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: complexipy
        name: complexipy (bridge cognitive complexity <=15)
        entry: uv run --locked complexipy bridge/ -mx 15
        language: system
        files: ^bridge/.*\.py$
        pass_filenames: false

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
