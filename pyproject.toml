# This repo contains the Wallac 1420 instrument microservice (vm-agent/,
# Windows-only) and the eLabFTW bridge (bridge/, Linux-side). The uv project
# manages the Linux bridge and development dependencies without packaging the
# repository itself. The Windows agent keeps its separate Python 3.8 runtime.

[project]
name = "wallac-victor2-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.139,<1",
    "pydantic>=2.13,<3",
    "uvicorn>=0.41,<1",
]

[dependency-groups]
dev = [
    "bandit>=1.7,<2",
    "complexipy>=6.2.0,<7",
    "hypothesis>=6,<7",
    "httpx2>=2,<3",
    "pre-commit>=4,<5",
    "pyright>=1.1.411,<2",
    "pytest>=9.1,<10",
    "pytest-cov>=7,<8",
    "pytest-timeout>=2.4,<3",
    "ruff==0.15.15",
    "mutmut>=3,<4",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py38"
extend-exclude = [
    "vm-agent/probe.py",
    "vm-agent/dump_tlb.py",
    "vm-agent/dump_methods.py",
    "vm-agent/dump_protocols.py",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "S", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",  # pytest uses assert for behavioral checks
    "S104",  # test-only bind addresses
    "S105",  # fixture tokens and pass/fail labels
    "S106",  # fixture token arguments
    "S108",  # test-only temporary paths
    "S310",  # mocked or local test URLs
    "S608",  # SQL identifiers come from fixed internal mappings.
]

"bridge/**/*.py" = [
    "S310",  # URLs are restricted by service configuration.
    "S608",  # SQL identifiers come from fixed internal mappings.
]

[tool.ruff.format]
quote-style = "double"

[tool.complexipy]
max_complexity_allowed = 15

[tool.coverage.run]
branch = true
source = ["bridge"]
omit = ["bridge/elabftw.py", "bridge/vm_agent_client.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-ra", "--strict-markers", "--timeout=30"]

[tool.pyright]
include = ["bridge", "tests"]
exclude = ["vm-agent"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportUntypedFunctionDecorator = false
venvPath = "."
venv = ".venv"

[tool.mutmut]
source_paths = ["bridge"]
pytest_add_cli_args_test_selection = ["tests/test_analysis.py", "tests/test_bridge_hardening.py", "tests/test_canonical.py", "tests/test_designer.py", "tests/test_durable_endpoints.py", "tests/test_durable_integration.py", "tests/test_durable_spool.py", "tests/test_executor.py", "tests/test_jobs.py", "tests/test_properties.py", "tests/test_security_fixes.py", "tests/test_well_utils.py"]
