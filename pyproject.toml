# Tooling config only -- this repo contains the Wallac 1420 instrument
# microservice (vm-agent/, Windows-only) and the eLabFTW bridge (bridge/,
# Linux-side).  NOT an installable Python package.
# Quality gates apply to the maintained stacks:
#   vm-agent/{agent,lid_watcher,launch_as_user}.py
#   bridge/{elabftw,signature,intake,models,errors}.py
# The COM-introspection diagnostics (vm-agent/probe.py, dump_*.py) are research
# tools and are excluded. Pyright checks bridge/ only — the vm-agent uses
# Windows/comtypes which false-positives on a Linux host/CI.

[tool.ruff]
line-length = 100
target-version = "py38"  # the agent runs on Python 3.8 (Windows 7)
extend-exclude = [
    "vm-agent/probe.py",
    "vm-agent/dump_tlb.py",
    "vm-agent/dump_methods.py",
    "vm-agent/dump_protocols.py",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # line length handled by the formatter

[tool.ruff.format]
quote-style = "double"

[tool.complexipy]
max_complexity_allowed = 15

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-ra", "--strict-markers", "--timeout=30"]

[tool.pyright]
include = ["bridge"]
exclude = ["vm-agent"]
# Bridge runs on Python 3.13 (lambdabiolab-computer); CI uses 3.11.
# vm-agent (Python 3.8 on Windows 7) is excluded above.
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
