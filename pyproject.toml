# This repo contains the Wallac 1420 instrument microservice (vm-agent/,
# Windows-only) and the eLabFTW bridge (bridge/, Linux-side). The uv project
# manages the Linux bridge and development dependencies without packaging the
# repository itself. The Windows agent keeps its separate Python 3.8 runtime.
# Quality gates apply to the maintained stacks.
# The COM-introspection diagnostics (vm-agent/probe.py, dump_*.py) are research
# tools and are excluded. Pyright checks bridge/ only — the vm-agent uses
# Windows/comtypes which false-positives on a Linux host/CI.

[project]
name = "wallac-victor2-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.139,<1",
    "pydantic>=2.13,<3",
    "pynacl>=1.6,<2",
    "uvicorn>=0.41,<1",
]

[dependency-groups]
dev = [
    "complexipy>=5.5,<6",
    "httpx>=0.28,<1",
    "pre-commit>=4,<5",
    "pyright>=1.1.411,<2",
    "pytest>=9.1,<10",
    "pytest-timeout>=2.4,<3",
    "ruff==0.15.15",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py38"  # the agent runs on Python 3.8 (Windows 7)
extend-exclude = [
    "vm-agent/probe.py",
    "vm-agent/dump_tlb.py",
    "vm-agent/dump_methods.py",
    "vm-agent/dump_protocols.py",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "S", "RUF"]
ignore = ["E501"]  # line length handled by the formatter

[tool.ruff.format]
quote-style = "double"

[tool.complexipy]
max_complexity_allowed = 15

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-ra", "--strict-markers", "--timeout=30"]

[tool.pyright]
include = ["bridge"]
exclude = ["vm-agent"]
# Bridge supports Python 3.11+; production currently runs Python 3.13.
# vm-agent (Python 3.8 on Windows 7) is excluded above.
pythonVersion = "3.11"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
